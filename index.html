<!doctype html>
<html lang="id" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bandingkan beli jadi, renovasi, atau bangun kos: modal, uang bersih per bulan, dan kapan modal kembali." />
    <meta name="robots" content="noindex" />
    <!-- Isi aplikasi berbahasa Indonesia; terjemahan otomatis Chrome bisa merusak tampilan -->
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#1f5fbf" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>" />
    <title>Beli atau Rawat? — Perbandingan Properti Keluarga</title>
  </head>
  <body>
    <div id="root">
      <!-- Tampil sampai aplikasi selesai dimuat; React menggantinya -->
      <div style="font-family: system-ui, sans-serif; padding: 48px 16px; text-align: center; color: #4a5361">
        <p id="boot-msg">Memuat…</p>
        <button id="boot-reload" type="button" hidden onclick="location.reload()" style="font: inherit; padding: 10px 18px; border-radius: 10px; border: 0; background: #1f5fbf; color: #fff; cursor: pointer">
          Muat ulang
        </button>
      </div>
    </div>
    <script>
      // Kalau file aplikasi gagal dimuat (mis. sinyal putus / versi baru baru saja terbit), tawarkan muat ulang
      setTimeout(function () {
        var msg = document.getElementById('boot-msg');
        if (!msg) return;
        msg.textContent = 'Halaman belum berhasil dimuat. Periksa koneksi internet, lalu tekan Muat ulang.';
        document.getElementById('boot-reload').hidden = false;
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
